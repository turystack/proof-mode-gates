name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  # Called by publish.yml, so nothing reaches npm without this passing.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm check

      # 244 tests, of which the fixture pairs are the point: every structural
      # check runs against a project that must fail it and one that must pass.
      # A check added without that pair fails this step by design.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The binary has to actually start. It did not, for a while: `tsc-alias`
      # was declared and never installed, so the emitted `@/` imports were
      # unresolvable and every command died on its first line.
      - name: The CLI runs
        run: node dist/cli.js --help
