<style>
  /* ---------------------------------------------------------------------
     Tokens. The light palette is complete on bare :root so the un-stamped
     document (system theme) always resolves; dark redefines tokens only.
     Semantic colours are deliberately not the accent: green means "passed",
     so it may not also mean "this is our brand".
     --------------------------------------------------------------------- */
  :root {
    color-scheme: light dark;

    --ink: #14181d;
    --ink-soft: #454f5c;
    --ink-faint: #6d7783;
    --paper: #f5f6f4;
    --surface: #ffffff;
    --surface-sunken: #eceef0;
    --rule: #d9dde2;
    --rule-strong: #b9c0c9;

    --accent: #2f4a7a;
    --accent-soft: #e6ebf4;

    --pass: #1c7d54;
    --pass-soft: #e2f1ea;
    --fail: #a8322d;
    --fail-soft: #f8e6e5;
    --warn: #9a6b12;
    --warn-soft: #f7eedb;
    --idle: #6d7783;
    --idle-soft: #e9ebee;

    --shadow: 0 1px 2px rgb(20 24 29 / 6%), 0 8px 24px -16px rgb(20 24 29 / 24%);

    --step--1: 0.78rem;
    --step-0: 0.94rem;
    --step-1: 1.14rem;
    --step-2: 1.5rem;
    --step-3: 2.1rem;

    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e7eaee;
      --ink-soft: #a7b0bb;
      --ink-faint: #7b8592;
      --paper: #11141a;
      --surface: #181c23;
      --surface-sunken: #131720;
      --rule: #2a303a;
      --rule-strong: #3b434f;
      --accent: #8ba6dd;
      --accent-soft: #1e2839;
      --pass: #5cc394;
      --pass-soft: #14291f;
      --fail: #e88b85;
      --fail-soft: #2d1917;
      --warn: #d7a94f;
      --warn-soft: #2a2216;
      --idle: #8891a0;
      --idle-soft: #1d222b;
      --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 10px 28px -18px rgb(0 0 0 / 70%);
    }
  }

  :root[data-theme="dark"] {
    --ink: #e7eaee;
    --ink-soft: #a7b0bb;
    --ink-faint: #7b8592;
    --paper: #11141a;
    --surface: #181c23;
    --surface-sunken: #131720;
    --rule: #2a303a;
    --rule-strong: #3b434f;
    --accent: #8ba6dd;
    --accent-soft: #1e2839;
    --pass: #5cc394;
    --pass-soft: #14291f;
    --fail: #e88b85;
    --fail-soft: #2d1917;
    --warn: #d7a94f;
    --warn-soft: #2a2216;
    --idle: #8891a0;
    --idle-soft: #1d222b;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 10px 28px -18px rgb(0 0 0 / 70%);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--step-0);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .page {
    max-width: 68rem;
    margin-inline: auto;
    padding: clamp(1.25rem, 3vw, 2.5rem) clamp(1rem, 3vw, 2rem) 4rem;
    display: flex;
    flex-direction: column;
    gap: 2.25rem;
  }

  /* --- masthead ------------------------------------------------------- */

  .masthead {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 1.5rem 2rem;
    align-items: start;
    padding-bottom: 1.5rem;
    border-bottom: 2px solid var(--ink);
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: var(--step--1);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 0.35rem;
  }

  .masthead h1 {
    font-family: var(--serif);
    font-size: var(--step-3);
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 0.6rem;
  }

  .masthead dl {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 1.4rem;
    margin: 0;
    font-size: var(--step--1);
    color: var(--ink-soft);
  }
  .masthead dl div { display: flex; gap: 0.4rem; }
  .masthead dt { color: var(--ink-faint); }
  .masthead dd { margin: 0; font-family: var(--mono); }

  .verdict { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; text-align: right; }

  .verdict-chip {
    display: inline-flex;
    align-items: baseline;
    gap: 0.5rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: var(--step-0);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid transparent;
  }
  .verdict-chip[data-state="pass"] { background: var(--pass-soft); color: var(--pass); border-color: color-mix(in srgb, var(--pass) 35%, transparent); }
  .verdict-chip[data-state="fail"] { background: var(--fail-soft); color: var(--fail); border-color: color-mix(in srgb, var(--fail) 35%, transparent); }
  .verdict small { color: var(--ink-faint); font-size: var(--step--1); }

  .banner {
    display: flex;
    gap: 0.75rem;
    padding: 0.85rem 1.1rem;
    border-radius: 8px;
    background: var(--fail-soft);
    color: var(--fail);
    border: 1px solid color-mix(in srgb, var(--fail) 30%, transparent);
    font-size: var(--step--1);
  }
  .banner strong { font-family: var(--mono); }

  /* --- sections -------------------------------------------------------- */

  section { display: flex; flex-direction: column; gap: 1rem; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.5rem;
  }
  .section-head h2 { font-size: var(--step-1); font-weight: 620; letter-spacing: -0.005em; margin: 0; }
  .section-head p { margin: 0; color: var(--ink-faint); font-size: var(--step--1); max-width: 52ch; }

  h3.sub {
    margin: 0;
    font-size: var(--step--1);
    font-family: var(--mono);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); }

  /* --- gate ladder ----------------------------------------------------- */

  .ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

  .rung {
    display: grid;
    grid-template-columns: 3.25rem minmax(0, 1fr) auto;
    gap: 0 1rem;
    align-items: center;
    padding: 0.85rem 1.1rem;
    border-bottom: 1px solid var(--rule);
    position: relative;
  }
  .rung:last-child { border-bottom: 0; }
  .rung::before { content: ""; position: absolute; left: 2.72rem; top: 0; bottom: 0; width: 2px; background: var(--rule); }
  .rung:first-child::before { top: 50%; }
  .rung:last-child::before { bottom: 50%; }

  .rung-step {
    position: relative;
    z-index: 1;
    width: 1.75rem;
    height: 1.75rem;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-family: var(--mono);
    font-size: var(--step--1);
    font-variant-numeric: tabular-nums;
    border: 2px solid var(--rule-strong);
    background: var(--surface);
    color: var(--ink-faint);
    justify-self: end;
  }
  .rung[data-state="pass"] .rung-step { border-color: var(--pass); color: var(--pass); background: var(--pass-soft); }
  .rung[data-state="fail"] .rung-step { border-color: var(--fail); color: var(--fail); background: var(--fail-soft); }
  .rung[data-state="warn"] .rung-step { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
  .rung[data-state="skipped"] .rung-step { border-style: dashed; }

  .rung-body { min-width: 0; display: flex; flex-direction: column; gap: 0.15rem; }
  .rung-name { font-weight: 600; }
  .rung-cmd { font-family: var(--mono); font-size: var(--step--1); color: var(--ink-faint); overflow-wrap: anywhere; }
  .rung-note { font-size: var(--step--1); color: var(--ink-soft); }
  .rung-result {
    display: flex; align-items: center; gap: 0.75rem;
    font-family: var(--mono); font-size: var(--step--1);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  .state {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.15rem 0.55rem; border-radius: 4px;
    letter-spacing: 0.05em; text-transform: uppercase; font-size: 0.7rem;
  }
  .state[data-state="pass"] { background: var(--pass-soft); color: var(--pass); }
  .state[data-state="fail"] { background: var(--fail-soft); color: var(--fail); }
  .state[data-state="warn"] { background: var(--warn-soft); color: var(--warn); }
  .state[data-state="skipped"], .state[data-state="manual"], .state[data-state="missing"] { background: var(--idle-soft); color: var(--idle); }

  /* --- tables ---------------------------------------------------------- */

  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }

  thead th {
    text-align: left; font-family: var(--mono); font-weight: 500;
    font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--ink-faint); padding: 0.65rem 1.1rem;
    border-bottom: 1px solid var(--rule); white-space: nowrap;
  }
  tbody td { padding: 0.65rem 1.1rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  td.mono, th.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .path { font-family: var(--mono); font-size: 0.8rem; overflow-wrap: anywhere; color: var(--ink-soft); }

  .added { color: var(--pass); }
  .removed { color: var(--fail); }

  /* --- meters ---------------------------------------------------------- */

  .meters { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); padding: 1.1rem; }
  .meter { display: flex; flex-direction: column; gap: 0.4rem; }
  .meter-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
  .meter-label { font-size: var(--step--1); color: var(--ink-soft); }
  .meter-value { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }
  .meter-track { position: relative; height: 0.5rem; border-radius: 999px; background: var(--surface-sunken); }
  .meter-fill { height: 100%; border-radius: 999px; background: var(--pass); }
  .meter[data-state="fail"] .meter-fill { background: var(--fail); }
  .meter[data-state="fail"] .meter-value { color: var(--fail); }
  .meter-threshold { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.55; }
  .meter-foot { font-size: 0.7rem; color: var(--ink-faint); font-family: var(--mono); display: flex; gap: 0.5rem; }
  .trend[data-dir="up"] { color: var(--pass); }
  .trend[data-dir="down"] { color: var(--fail); }

  .coverage-pair { display: grid; gap: 0; }
  .coverage-pair > .band {
    padding: 0.5rem 1.1rem;
    border-bottom: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: var(--surface-sunken);
  }

  /* --- matrix ---------------------------------------------------------- */

  .matrix td.cell { text-align: center; font-family: var(--mono); }
  .matrix td.cell[data-state="pass"] { color: var(--pass); }
  .matrix td.cell[data-state="fail"] { color: var(--fail); background: var(--fail-soft); }
  .matrix td.cell[data-state="n/a"] { color: var(--ink-faint); }

  /* --- screens --------------------------------------------------------- */

  .screens { display: flex; flex-direction: column; gap: 1.5rem; }
  .screen { padding: 1.1rem; display: flex; flex-direction: column; gap: 1rem; }
  .screen-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .screen-head h3 { margin: 0; font-size: var(--step-0); font-weight: 620; }
  .screen-route { font-family: var(--mono); font-size: var(--step--1); color: var(--ink-faint); }

  .compare { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }
  .strip { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); }

  figure { margin: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  figcaption {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink-faint);
    display: flex; justify-content: space-between; gap: 0.5rem;
  }
  figure img, figure .shot { width: 100%; display: block; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface-sunken); }
  figure .shot[data-required="true"] { border-color: var(--fail); border-style: dashed; color: var(--fail); }

  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.3rem; }
  .checks li { display: grid; grid-template-columns: 1.1rem minmax(0, 1fr) auto; gap: 0.55rem; align-items: baseline; font-size: var(--step--1); }
  .tick { font-family: var(--mono); color: var(--pass); }
  .tick[data-state="fail"] { color: var(--fail); }
  .checks .ref { font-family: var(--mono); font-size: 0.75rem; color: var(--ink-faint); white-space: nowrap; }

  /* --- stats ----------------------------------------------------------- */

  .stats { display: flex; flex-wrap: wrap; gap: 0.6rem; padding: 1.1rem 1.1rem 0; }
  .stat { display: flex; flex-direction: column; gap: 0.1rem; padding: 0.6rem 0.9rem; border-radius: 8px; background: var(--surface-sunken); min-width: 7.5rem; }
  .stat-value { font-family: var(--mono); font-size: var(--step-2); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat-label { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); font-family: var(--mono); }

  .detector { font-family: var(--mono); font-size: 0.72rem; padding: 0.1rem 0.45rem; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .detector[data-kind="manual"] { background: var(--idle-soft); color: var(--idle); }

  details.raw { padding: 0; }
  details.raw > summary { cursor: pointer; padding: 0.8rem 1.1rem; font-size: var(--step--1); color: var(--ink-soft); font-family: var(--mono); }
  details.raw[open] > summary { border-bottom: 1px solid var(--rule); }
  details.raw pre { margin: 0; padding: 1.1rem; overflow-x: auto; font-family: var(--mono); font-size: 0.75rem; line-height: 1.5; color: var(--ink-soft); }

  footer.colophon {
    border-top: 1px solid var(--rule);
    padding-top: 1rem;
    font-size: var(--step--1);
    color: var(--ink-faint);
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.4rem;
    font-family: var(--mono);
  }

  @media print {
    body { background: #fff; }
    .card { box-shadow: none; }
    details.raw { display: none; }
  }
</style>

  <script>
  (() => {
    const data = JSON.parse(document.getElementById('gate-report').textContent)
    const root = document.getElementById('report')

    const el = (tag, attrs = {}, ...children) => {
      const node = document.createElement(tag)
      for (const [key, value] of Object.entries(attrs)) {
        if (value === null || value === undefined || value === false) { continue }
        if (key === 'class') { node.className = value; continue }
        if (key === 'text') { node.textContent = value; continue }
        node.setAttribute(key, value)
      }
      for (const child of children.flat()) {
        if (child === null || child === undefined || child === false) { continue }
        node.append(child)
      }
      return node
    }

    const section = (title, blurb, ...body) =>
      el('section', {},
        el('div', { class: 'section-head' },
          el('h2', { text: title }),
          blurb ? el('p', { text: blurb }) : null),
        ...body)

    const stateChip = (state) => el('span', { class: 'state', 'data-state': state, text: state })
    const signed = (value) => (value >= 0 ? '+' : '') + value.toFixed(1)

    /* ---------------------------------------------------------------
       Evidence that was required and never arrived is a failure, not a
       placeholder. This is the report obeying ARC-TST-7 about itself:
       nothing passes empty.
       --------------------------------------------------------------- */
    const gaps = []
    for (const screen of data.frontend?.screens ?? []) {
      const captured = new Set(
        (screen.captures ?? []).filter((capture) => capture.image).map((capture) => capture.state),
      )
      for (const state of screen.required ?? []) {
        if (!captured.has(state)) { gaps.push(`${screen.name} · ${state}`) }
      }
    }

    const failedRungs = data.ladder.filter((rung) => rung.state === 'fail')
    const green = data.ladder.filter((rung) => rung.state === 'pass').length
    const notRun = data.ladder.length - green - failedRungs.length
    const verdict = failedRungs.length > 0 || gaps.length > 0 ? 'fail' : 'pass'

    /* --- shared builders ------------------------------------------------ */

    const shot = (src, label, required) => {
      if (src) { return el('img', { src, alt: label, loading: 'lazy' }) }
      const missing = Boolean(required)
      const message = missing ? 'required capture missing' : 'no capture'
      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="' + label + '">' +
        '<rect width="320" height="200" fill="none"/>' +
        '<g fill="none" stroke="currentColor" stroke-width="1" opacity="0.35">' +
        '<rect x="16" y="16" width="288" height="28" rx="4"/>' +
        '<rect x="16" y="56" width="288" height="128" rx="4"/>' +
        '<line x1="16" y1="88" x2="304" y2="88"/><line x1="16" y1="120" x2="304" y2="120"/>' +
        '<line x1="16" y1="152" x2="304" y2="152"/></g>' +
        '<text x="160" y="108" text-anchor="middle" font-family="ui-monospace, monospace" ' +
        'font-size="11" fill="currentColor" opacity="0.75">' + message + '</text></svg>'
      const box = el('div', {
        class: 'shot',
        'data-required': missing ? 'true' : 'false',
        style: missing ? '' : 'color: var(--ink-faint)',
      })
      box.innerHTML = svg
      return box
    }

    const meter = (metric, floor) => {
      const ok = metric.value >= floor
      const delta = metric.value - floor
      const drift = metric.baseline === undefined ? null : metric.value - metric.baseline
      return el('div', { class: 'meter', 'data-state': ok ? 'pass' : 'fail' },
        el('div', { class: 'meter-head' },
          el('span', { class: 'meter-label', text: metric.label }),
          el('span', { class: 'meter-value', text: metric.value.toFixed(1) + '%' })),
        el('div', { class: 'meter-track' },
          el('div', { class: 'meter-fill', style: 'width:' + metric.value + '%' }),
          el('div', { class: 'meter-threshold', style: 'left:' + floor + '%', title: 'Floor ' + floor + '%' })),
        el('div', { class: 'meter-foot' },
          el('span', { text: signed(delta) + ' vs floor ' + floor + '%' }),
          drift === null
            ? null
            : el('span', {
                class: 'trend',
                'data-dir': drift >= 0 ? 'up' : 'down',
                text: signed(drift) + ' vs baseline',
              })))
    }

    /* Total coverage answers "is the codebase healthy". Diff coverage answers
       "is the code this task wrote tested" — and only the second one can be
       failed by the change under review. */
    const coverageCard = (coverage) =>
      el('div', { class: 'card coverage-pair' },
        el('div', { class: 'band', text: 'whole codebase · floor ' + coverage.floor + '%' }),
        el('div', { class: 'meters' }, coverage.total.map((metric) => meter(metric, coverage.floor))),
        el('div', { class: 'band', text: 'lines this task changed · floor ' + coverage.diffFloor + '%' }),
        el('div', { class: 'meters' }, coverage.diff.map((metric) => meter(metric, coverage.diffFloor))))

    const specCard = (specs) =>
      el('div', { class: 'card table-wrap' },
        el('table', {},
          el('thead', {}, el('tr', {},
            el('th', { text: 'Spec' }),
            el('th', { text: 'Proven by' }),
            el('th', { text: 'Level' }),
            el('th', { text: 'State' }))),
          el('tbody', {}, specs.map((row) =>
            el('tr', {},
              el('td', { text: row.spec }),
              el('td', {}, el('span', { class: 'path', text: row.test })),
              el('td', { class: 'mono', text: row.level }),
              el('td', {}, stateChip(row.state)))))))

    /* --- masthead -------------------------------------------------------- */

    const task = data.task
    const meta = [
      ['Task', task.id],
      ['Branch', task.branch],
      ['Commit', task.commit],
      ['Base', task.baseline],
      ['By', task.author],
      ['Ran', new Date(task.finishedAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })],
      ['Took', Math.round(task.durationMs / 1000) + 's'],
    ]

    root.append(
      el('header', { class: 'masthead' },
        el('div', {},
          el('p', { class: 'eyebrow', text: 'Delivery gate report' }),
          el('h1', { text: task.title }),
          el('dl', {}, meta.map(([term, value]) =>
            el('div', {}, el('dt', { text: term }), el('dd', { text: value }))))),
        el('div', { class: 'verdict' },
          el('span', { class: 'verdict-chip', 'data-state': verdict },
            el('span', {
              // "All gates green" is only true when every rung actually ran.
              // A skipped rung is a fact worth showing, not a shade of green.
              text: verdict === 'fail'
                ? (failedRungs.length + gaps.length) + ' blocking'
                : green === data.ladder.length
                  ? 'All gates green'
                  : green + ' of ' + data.ladder.length + ' green',
            })),
          el('small', {
            text: notRun > 0
              ? notRun + ' rung(s) did not run — see the ladder'
              : green + ' of ' + data.ladder.length + ' gates passed',
          }))))

    if (gaps.length > 0) {
      root.append(el('div', { class: 'banner' },
        el('span', { text: '⃠' }),
        el('span', {},
          el('strong', { text: gaps.length + ' required capture(s) missing: ' }),
          gaps.join(' · ') + '. A gate that renders an empty placeholder instead of failing is a gate that lies.')))
    }

    /* --- gate ladder ----------------------------------------------------- */

    root.append(section(
      'Gate ladder',
      'Runs in order and stops at the first red rung, so a later gate never reports on code an earlier one rejected.',
      el('div', { class: 'card' },
        el('ol', { class: 'ladder' }, data.ladder.map((rung, index) =>
          el('li', { class: 'rung', 'data-state': rung.state },
            el('span', { class: 'rung-step', text: String(index + 1) }),
            el('div', { class: 'rung-body' },
              el('span', { class: 'rung-name', text: rung.name }),
              el('code', { class: 'rung-cmd', text: rung.command }),
              rung.note ? el('span', { class: 'rung-note', text: rung.note }) : null),
            el('div', { class: 'rung-result' },
              el('span', { text: rung.result || '' }),
              stateChip(rung.state))))))))

    /* --- what changed ----------------------------------------------------- */

    const changed = data.changed
    if (changed) {
    root.append(section(
      'What changed',
      'The scope the green above actually covers. A file with new lines and no covering test is listed even when every total is healthy.',
      el('div', { class: 'card' },
        el('div', { class: 'stats' },
          el('div', { class: 'stat' },
            el('span', { class: 'stat-value', text: String(changed.files) }),
            el('span', { class: 'stat-label', text: 'files' })),
          el('div', { class: 'stat' },
            el('span', { class: 'stat-value added', text: '+' + changed.added }),
            el('span', { class: 'stat-label', text: 'added' })),
          el('div', { class: 'stat' },
            el('span', { class: 'stat-value removed', text: '−' + changed.removed }),
            el('span', { class: 'stat-label', text: 'removed' })),
          el('div', { class: 'stat' },
            el('span', { class: 'stat-value', text: String(changed.untested.length) }),
            el('span', { class: 'stat-label', text: 'untested' }))),
        el('div', { class: 'table-wrap' },
          el('table', {},
            el('thead', {}, el('tr', {},
              el('th', { text: 'File' }),
              el('th', { text: 'Added' }),
              el('th', { text: 'Removed' }),
              el('th', { text: 'Covered' }))),
            el('tbody', {}, changed.entries.map((row) =>
              el('tr', {},
                el('td', {}, el('span', { class: 'path', text: row.path })),
                el('td', { class: 'num added', text: '+' + row.added }),
                el('td', { class: 'num removed', text: '−' + row.removed }),
                el('td', { class: 'num', text: row.covered.toFixed(1) + '%' })))))))))
    }

    /* --- context ---------------------------------------------------------- */

    if (data.context) {
    root.append(section(
      'What this was built from',
      'Every input the implementation was allowed to depend on, and the skill that resolved it. An empty row here means something was built over nothing.',
      el('div', { class: 'card table-wrap' },
        el('table', {},
          el('thead', {}, el('tr', {},
            el('th', { text: 'Input' }),
            el('th', { text: 'What it says' }),
            el('th', { text: 'Where it lives' }),
            el('th', { text: 'Resolved by' }))),
          el('tbody', {}, data.context.map((row) =>
            el('tr', {},
              el('td', { class: 'mono', text: row.kind }),
              el('td', { text: row.title }),
              el('td', {}, el('span', { class: 'path', text: row.source })),
              el('td', { class: 'mono', text: row.resolvedBy }))))))))
    }

    /* --- law coverage ------------------------------------------------------ */

    const law = data.law
    if (law) {
    root.append(section(
      'Law coverage',
      'Of the rules this change touched: which a machine checked, which a person signed, and how many were broken. A `manual` row is a claim a person is standing behind — it is counted apart so a green report is never read as a fully automated one.',
      el('div', { class: 'card' },
        el('div', { class: 'stats' },
          el('div', { class: 'stat' },
            el('span', { class: 'stat-value', text: law.touched + '/' + law.total }),
            el('span', { class: 'stat-label', text: 'touched' })),
          el('div', { class: 'stat' },
            el('span', { class: 'stat-value', text: String(law.automated) }),
            el('span', { class: 'stat-label', text: 'machine' })),
          el('div', { class: 'stat' },
            el('span', { class: 'stat-value', text: String(law.manual) }),
            el('span', { class: 'stat-label', text: 'signed' })),
          el('div', { class: 'stat' },
            el('span', { class: 'stat-value', text: String(law.violations) }),
            el('span', { class: 'stat-label', text: 'violations' })),
          el('div', { class: 'stat' },
            el('span', { class: 'stat-value', text: Math.round((law.automated / law.touched) * 100) + '%' }),
            el('span', { class: 'stat-label', text: 'automated' }))),
        el('div', { class: 'table-wrap' },
          el('table', {},
            el('thead', {}, el('tr', {},
              el('th', { text: 'Rule' }),
              el('th', { text: 'Law' }),
              el('th', { text: 'Detector' }),
              el('th', { text: 'State' }))),
            el('tbody', {}, law.bindings.map((binding) =>
              el('tr', {},
                el('td', { class: 'mono', text: binding.id }),
                el('td', {},
                  binding.law,
                  binding.note ? el('div', { class: 'path', text: binding.note }) : null,
                  binding.reviewer ? el('div', { class: 'path', text: 'signed by ' + binding.reviewer }) : null),
                el('td', {}, el('span', {
                  class: 'detector',
                  'data-kind': binding.detector === 'manual' ? 'manual' : 'auto',
                  text: binding.detector,
                })),
                el('td', {}, stateChip(binding.state === 'reviewed' ? 'manual' : binding.state)))))),
        law.bindings.length < law.touched
          ? el('p', { class: 'path', text: 'Showing ' + law.bindings.length + ' of the ' + law.touched + ' laws this change touched.' })
          : null)))
    }

    /* --- contract delta ----------------------------------------------------- */

    if (data.contractDelta) {
    root.append(section(
      'Contract delta',
      'What other people now depend on. A breaking change has to be visible in the delivery, not discovered by a consumer.',
      el('div', { class: 'card table-wrap' },
        el('table', {},
          el('thead', {}, el('tr', {},
            el('th', { text: 'Kind' }),
            el('th', { text: 'Change' }),
            el('th', { text: 'Name' }),
            el('th', { text: 'Breaking' }))),
          el('tbody', {}, data.contractDelta.map((row) =>
            el('tr', {},
              el('td', { class: 'mono', text: row.kind }),
              el('td', { class: 'mono', text: row.change }),
              el('td', {},
                el('span', { class: 'path', text: row.name }),
                row.note ? el('div', { class: 'path', text: row.note }) : null),
              el('td', {}, stateChip(row.breaking ? 'fail' : 'pass')))))))))
    }

    /* --- backend ------------------------------------------------------------ */

    const backend = data.backend
    if (backend) {
    root.append(section(
      'Backend evidence',
      'Coverage against both floors, every spec tied to the test that proves it, the endpoints as published, and what the migration did to the database.',
      el('h3', { class: 'sub', text: 'Coverage' }),
      coverageCard(backend.coverage),
      el('h3', { class: 'sub', text: 'Specs' }),
      specCard(backend.specs),
      el('h3', { class: 'sub', text: 'Endpoints' }),
      el('div', { class: 'card table-wrap' },
        el('table', {},
          el('thead', {}, el('tr', {},
            el('th', { text: 'Method' }),
            el('th', { text: 'Endpoint' }),
            el('th', { text: 'Answers' }),
            el('th', { text: 'In the docs' }))),
          el('tbody', {}, backend.endpoints.map((row) =>
            el('tr', {},
              el('td', { class: 'mono', text: row.method }),
              el('td', {}, el('span', { class: 'path', text: row.path })),
              el('td', { class: 'mono', text: row.status }),
              el('td', {}, stateChip(row.documented ? 'pass' : 'fail'))))))),
      el('h3', { class: 'sub', text: 'Migrations' }),
      el('div', { class: 'card table-wrap' },
        el('table', {},
          el('thead', {}, el('tr', {},
            el('th', { text: 'Migration' }),
            el('th', { text: 'Phase' }),
            el('th', { text: 'Backfill' }),
            el('th', { text: 'Reversible' }),
            el('th', { text: 'State' }))),
          el('tbody', {}, backend.migrations.map((row) =>
            el('tr', {},
              el('td', {}, el('span', { class: 'path', text: row.name })),
              el('td', { class: 'mono', text: row.phase }),
              el('td', { class: 'mono', text: row.backfill }),
              el('td', {}, stateChip(row.reversible ? 'pass' : 'warn')),
              el('td', {}, stateChip(row.state === 'applied' ? 'pass' : row.state))))))),
      backend.docsShot
        ? el('figure', { class: 'card', style: 'padding:1.1rem' },
            shot(backend.docsShot, 'Published endpoint documentation'),
            el('figcaption', {}, el('span', { text: 'Published endpoint docs' })))
        : null))
    }

    /* --- frontend ------------------------------------------------------------ */

    if (data.frontend && data.frontend.screens.length > 0) {
      const frontend = data.frontend
      const outcomes = frontend.outcomes
      const a11y = frontend.accessibility
      const violations = Object.values(a11y.violations).reduce((sum, count) => sum + count, 0)

      root.append(section(
        'Frontend evidence',
        'The same two floors, the five outcomes as a matrix instead of a claim, the accessibility and size numbers, and the design next to what shipped.',
        el('h3', { class: 'sub', text: 'Coverage' }),
        coverageCard(frontend.coverage),
        el('h3', { class: 'sub', text: 'Specs' }),
        specCard(frontend.specs),

        el('h3', { class: 'sub', text: 'Five outcomes per surface' }),
        el('div', { class: 'card table-wrap' },
          el('table', { class: 'matrix' },
            el('thead', {}, el('tr', {},
              el('th', { text: 'Surface' }),
              outcomes.states.map((state) => el('th', { text: state })))),
            el('tbody', {}, outcomes.surfaces.map((surface) =>
              el('tr', {},
                el('td', { text: surface.name }),
                outcomes.states.map((state) => {
                  const value = surface.cells[state] ?? 'fail'
                  return el('td', {
                    class: 'cell',
                    'data-state': value,
                    text: value === 'pass' ? '✓' : value === 'n/a' ? '–' : '✕',
                    title: surface.name + ' · ' + state + ' · ' + value,
                  })
                })))))),

        el('h3', { class: 'sub', text: 'Accessibility and size' }),
        el('div', { class: 'card' },
          el('div', { class: 'stats' },
            el('div', { class: 'stat' },
              el('span', { class: 'stat-value', text: String(violations) }),
              el('span', { class: 'stat-label', text: a11y.tool + ' violations' })),
            ...Object.entries(a11y.violations).map(([impact, count]) =>
              el('div', { class: 'stat' },
                el('span', { class: 'stat-value', text: String(count) }),
                el('span', { class: 'stat-label', text: impact }))),
          ),
          el('div', { class: 'meters' }, frontend.bundle.budgets.map((budget) => meter(
            {
              label: budget.name + ' (' + budget.unit + ')',
              value: Math.round((budget.value / budget.budget) * 1000) / 10,
              baseline: Math.round((budget.baseline / budget.budget) * 1000) / 10,
            },
            0,
          )))),

        el('h3', { class: 'sub', text: 'Screens' }),
        el('div', { class: 'screens' }, frontend.screens.map((screen) => {
          const success = (screen.captures ?? []).find((capture) => capture.state === 'success')
          const others = (screen.captures ?? []).filter((capture) => capture.state !== 'success')
          const requires = (state) => (screen.required ?? []).includes(state)

          return el('article', { class: 'card screen' },
            el('div', { class: 'screen-head' },
              el('h3', { text: screen.name }),
              el('span', { class: 'screen-route', text: screen.route })),

            el('div', { class: 'compare' },
              el('figure', {},
                shot(screen.proposed, 'Proposed design for ' + screen.name, true),
                el('figcaption', {}, el('span', { text: 'Proposed' }), el('span', { text: 'design' }))),
              el('figure', {},
                shot(success?.image, 'Shipped screen for ' + screen.name, requires('success')),
                el('figcaption', {}, el('span', { text: 'Shipped' }), el('span', { text: 'playwright' })))),

            others.length > 0
              ? el('div', { class: 'strip' }, others.map((capture) =>
                  el('figure', {},
                    shot(capture.image, screen.name + ' · ' + capture.state, requires(capture.state)),
                    el('figcaption', {},
                      el('span', { text: capture.state }),
                      el('span', { text: requires(capture.state) ? 'required' : 'extra' })))))
              : null,

            el('div', { class: 'compare' },
              el('div', {},
                el('p', { class: 'eyebrow', text: 'Rules held' }),
                el('ul', { class: 'checks' }, screen.checks.map((check) =>
                  el('li', {},
                    el('span', { class: 'tick', 'data-state': check.state, text: check.state === 'pass' ? '✓' : '✕' }),
                    el('span', { text: check.text }),
                    el('span', { class: 'ref', text: check.ref }))))),
              el('div', {},
                el('p', { class: 'eyebrow', text: 'Tests' }),
                el('ul', { class: 'checks' }, screen.tests.map((test) =>
                  el('li', {},
                    el('span', { class: 'tick', 'data-state': test.state, text: test.state === 'pass' ? '✓' : '✕' }),
                    el('span', { class: 'path', text: test.test }),
                    el('span', { class: 'ref', text: test.state })))))))
        }))))
    }

    /* --- structural checks -------------------------------------------------- */

    if (data.structure && data.structure.length > 0) {
      root.append(section(
        'Structural checks',
        'The gate:* bindings the skills name. A check this runner has not implemented reports as pending — never as passing, and never dropped.',
        el('div', { class: 'card table-wrap' },
          el('table', {},
            el('thead', {}, el('tr', {},
              el('th', { text: 'Check' }),
              el('th', { text: 'Result' }),
              el('th', { text: 'State' }))),
            el('tbody', {}, data.structure.map((check) =>
              el('tr', {},
                el('td', { class: 'mono', text: 'gate:' + check.id }),
                el('td', {},
                  check.summary,
                  ...(check.violations ?? []).map((violation) =>
                    el('div', { class: 'path', text: violation.rule + '  ' + violation.file + (violation.line ? ':' + violation.line : '') + ' — ' + violation.message }))),
                el('td', {}, stateChip(check.state)))))))))
    }

    /* --- raw --------------------------------------------------------------- */

    if (data.raw) {
      root.append(section(
        'Raw output',
        'Kept verbatim so a green report can always be checked against what the tools actually printed.',
        ...Object.entries(data.raw).map(([tool, output]) =>
          el('details', { class: 'card raw' },
            el('summary', { text: tool }),
            el('pre', { text: String(output).replace(/\\n/g, '\n') })))))
    }

    /* --- colophon ----------------------------------------------------------- */

    const provenance = data.provenance ?? {}

    root.append(el('footer', { class: 'colophon' },
      el('span', { text: data.schema }),
      provenance.runner ? el('span', { text: provenance.runner }) : null,
      ...(provenance.skills ?? []).map((skill) =>
        el('span', { text: skill.name.replace('tury-stack-', '') + ' ' + skill.version })),
      el('span', { text: 'gate-report.json written beside this file' })))
  })()
  </script>
</body>
</html>
